name: Website checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Check production routes and enquiry safeguards
        run: |
          npm run start -- --port 3001 > /tmp/sanora-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3001 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:smoke
      - name: Check Cloudflare Workers build
        run: npm run build:cloudflare -- --skipNextBuild
      - name: Validate Worker bundle without publishing
        run: npx wrangler deploy --dry-run
